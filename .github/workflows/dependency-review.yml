name: Dependency review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # AGPL-3.0 project: flag dependencies whose licences can't be combined with it.
          deny-licenses: SSPL-1.0, BUSL-1.1, Commons-Clause
          comment-summary-in-pr: on-failure
